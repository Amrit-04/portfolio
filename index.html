<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1EA" />
    <meta
      name="description"
      content="Amriteshkumar Yadav — engineering portfolio &amp; playable track. AI/ML systems, backend and distributed engineering, quantitative computing. Every metric is sourced; seven project demos run in your browser."
    />
    <title>Amriteshkumar Yadav — Engineering Notebook &amp; Track</title>
    <!-- Inspiration Typography (Anton, Permanent Marker, Special Elite) + Google Fonts -->
    <link rel="stylesheet" href="/portfolio/fonts/google-fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Squigglevision Boiling Ink Filters -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none;" aria-hidden="true">
      <filter id="squiggle-0" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="2" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggle-1" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="22" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="squiggle-2" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="47" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
